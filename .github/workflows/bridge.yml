name: Bridge

on:
  push:
    paths: ['bridge/**', '.github/workflows/bridge.yml']
  pull_request:
    paths: ['bridge/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v bridge/test_baseline_bridge.py
