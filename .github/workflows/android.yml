name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
    tags: ['v*']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release for this version (e.g. 0.2.1); creates tag vX.Y.Z on the chosen commit. Leave empty for a CI build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.2 build-tools;37.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: v
        env:
          RELEASE_INPUT: ${{ github.event.inputs.release }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF#refs/tags/v}"
          elif [ -n "$RELEASE_INPUT" ]; then
            [[ "$RELEASE_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release must look like 1.2.3" >&2; exit 1; }
            NAME="$RELEASE_INPUT"
          else NAME="0.0.${GITHUB_RUN_NUMBER}-ci"; fi
          if [[ "$GITHUB_REF" == refs/tags/v* || -n "$RELEASE_INPUT" ]]; then echo "tag=v$NAME" >> "$GITHUB_OUTPUT"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "BASELINE_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "BASELINE_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.BASELINE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BASELINE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          BASELINE_KEYSTORE_PASSWORD: ${{ secrets.BASELINE_KEYSTORE_PASSWORD }}
          BASELINE_KEY_ALIAS: ${{ secrets.BASELINE_KEY_ALIAS }}
          BASELINE_KEY_PASSWORD: ${{ secrets.BASELINE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/baseline-${{ steps.v.outputs.name }}.apk"
          (cd out && sha256sum *.apk | tee SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: baseline-apk
          path: android/out/*

      - name: Publish GitHub release
        if: steps.v.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          # On a manual release this also creates the tag at the built commit.
          gh release create "$TAG" out/*.apk out/SHA256SUMS.txt --target "$GITHUB_SHA" \
            --title "Baseline $TAG" --generate-notes --latest
